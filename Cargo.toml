[package]
name = "lokal"
version = "0.2.1"
edition = "2024"
description = "A terminal assistant that runs on a local model"
authors = ["Guilherme Madaleno"]
homepage = "https://guimadaleno.com"
repository = "https://github.com/guimadaleno/lokal"

[dependencies]
# Checking that an update is Lokal's: the signature on latest.json (release.rs).
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
# Ctrl+C handling, signals to a running command's process group, and whether
# the folder Lokal runs from can be written to.
libc = "0.2.190"
# The `>` prompt: line editing, history, Tab completion and inline hints.
# custom-bindings: Ctrl+C acts on what's typed (clear it, or quit on a second press).
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings"] }
# release.rs reads latest.json into structs of its own.
serde = { version = "1", features = ["derive"] }
# The chat API, the saved conversation and latest.json are JSON.
serde_json = "1.0.154"
# The SHA-256 latest.json gives for every file of an update.
sha2 = { version = "0.11", default-features = false }
# The diff shown before every file change.
similar = "3.2.0"
# HTTP to the model server. Plain HTTP only: the server is on this machine or its host.
ureq = { version = "3.4.2", default-features = false }

[profile.release]
lto = true
strip = true
