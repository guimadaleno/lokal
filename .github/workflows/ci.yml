# Every push to main and every pull request is checked the way a release is,
# so a broken test or a lint shows on the commit that brought it rather than
# at the next tag. Nothing here publishes anything.
name: CI

# A branch is checked through its pull request: pushing on every branch too
# would check it twice. Prose and the site change nothing these jobs check,
# so a push of only those runs none of them; markdown is skipped by name,
# never as `**.md`, which would skip a file compiled in with it.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CLAUDE.md', 'CHANGELOG.md', 'docs/**', 'tests/release/README.md', 'tests/report/README.md', '.claude/**', 'site/**']
  pull_request:
    paths-ignore: ['README.md', 'CLAUDE.md', 'CHANGELOG.md', 'docs/**', 'tests/release/README.md', 'tests/report/README.md', '.claude/**', 'site/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job stops at about three times its slowest run: without a limit,
# one stuck on a download runs for six hours.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Without it every run builds every dependency from scratch, the
      # largest part of its minutes.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-

      - name: Formatting
        run: cargo fmt --check

      # Warnings fail here: clippy is clean on main, and stays that way.
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # The release is static, built with musl, whose libc differs from
      # glibc's in types and constants: checked here rather than at the tag.
      # LOKAL_RELEASE_BUILD compiles update.rs in, as the release does.
      - name: The release's target compiles
        run: |
          rustup target add x86_64-unknown-linux-musl
          LOKAL_RELEASE_BUILD=1 cargo check --all-targets --target x86_64-unknown-linux-musl
